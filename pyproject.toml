[project]
name = "surus"
version = "0.2.0"
description = "A fast SQL IDE for Postgres with an LLM agent that writes performant SQL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "psycopg[binary,pool]>=3.2",
    "anthropic>=0.40",
    "keyring>=25.0",
    "pydantic>=2.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
